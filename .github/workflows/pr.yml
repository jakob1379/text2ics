name: pr
on:
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Without this, one failing leg cancels the others and reports them as
      # failures too, which hides which version actually broke.
      fail-fast: false
      matrix:
        # requires-python is >=3.13,<3.14 (3.13 only): >=3.13 predates this
        # workflow, and nooa caps at <3.14. A 3.12 leg cannot resolve at all.
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --locked # abort if the lockfile changes
      - run: uv run poe ci:fmt             # check formatting is correct
      - run: uv run poe ci:lint            # and linting
      - run: uv run poe check              # typecheck too
      - run: uv run poe test               # then run your tests!
